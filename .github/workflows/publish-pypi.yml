name: publish-pypi

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          manifest-path: pyproject.toml
          environments: package
          locked: true
          cache: true

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pixi run -e package python - <<'PY'
          import os
          import subprocess
          import sys

          version = subprocess.check_output(
              ["hatch", "version"],
              text=True,
          ).strip()
          expected_tag = f"v{version}"
          release_tag = os.environ["RELEASE_TAG"]
          if release_tag != expected_tag:
              print(
                  f"Release tag {release_tag!r} does not match package version "
                  f"{version!r}; expected {expected_tag!r}.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Build distributions
        run: pixi run -e package package-build

      - name: Check distributions
        run: pixi run -e package package-check

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fftrf/
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
