[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fftrf"
dynamic = ["version"]
authors = [
  { name="Alexander Weigl", email="alexander.weigl@plus.ac.at" },
  { name="Fabian Schmidt", email="fabian.schmidt@plus.ac.at" },
  { name="Nathan Weisz", email="nathan.weisz@plus.ac.at" },
]
description = "ffTRF: frequency-domain temporal response function and deconvolution tools."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.12",
]

[project.urls]
Homepage = "https://github.com/weigla/ffTRF"
Issues = "https://github.com/weigla/ffTRF/issues"
Documentation = "https://weigla.github.io/ffTRF/"

[project.optional-dependencies]
test = [
  "pytest>=9",
  "pytest-cov>=6",
]
lint = [
  "ruff>=0.8",
]
compare = [
  "mtrf>=2.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-jupyter>=0.25",
  "mkdocs-material>=9.5",
  "mkdocstrings>=0.28",
  "mkdocstrings-python>=1.12",
  "pygments<2.20",
]

[tool.hatch.version]
path = "src/fftrf/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fftrf"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/fftrf",
  "/tests",
  "/docs",
  "/examples",
  "/artifacts/runtime_benchmark.md",
  "/artifacts/runtime_benchmark.json",
  "/artifacts/real_eeg_benchmark.md",
  "/artifacts/real_eeg_benchmark.json",
  "/pyproject.toml",
  "/pixi.lock",
  "/mkdocs.yml",
  "/README.md",
  "/LICENSE",
  "/CITATION.cff",
  "/CONTRIBUTING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["fftrf"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
extend-exclude = ["docs/notebooks"]
line-length = 99
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
]

[tool.ruff.lint.per-file-ignores]
"src/fftrf/model.py" = ["F401"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
"matplotlib-base" = ">=3.8"
python = ">=3.10,<3.15"
numpy = ">=1.26"
scipy = ">=1.12"

[tool.pixi.pypi-dependencies]
fftrf = { path = ".", editable = true }

[tool.pixi.feature.tests.pypi-dependencies]
pytest = ">=9"
pytest-cov = ">=6"

[tool.pixi.feature.lint.dependencies]
ruff = ">=0.8"

[tool.pixi.feature.package.dependencies]
hatch = ">=1.14"
hatchling = ">=1.26"
pip = ">=24"
python-build = ">=1.2"
twine = ">=6"

[tool.pixi.feature.comparison.pypi-dependencies]
mtrf = ">=2.0"

[tool.pixi.feature.docs-site.pypi-dependencies]
mkdocs = ">=1.6"
mkdocs-jupyter = ">=0.25"
mkdocs-material = ">=9.5"
mkdocstrings = ">=0.28"
mkdocstrings-python = ">=1.12"
pygments = "<2.20"

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
test = { features = ["tests"], solve-group = "default" }
lint = { features = ["lint"], solve-group = "default" }
package = { features = ["package"], solve-group = "package" }
compare = { features = ["comparison"], solve-group = "default" }
docs = { features = ["docs-site"], solve-group = "default" }

[tool.pixi.tasks]
test = "python -m pytest -q"
coverage = "python -m pytest -q --cov=fftrf --cov-branch --cov-report=term-missing --cov-report=xml"
lint = "ruff check ."
package-build = "python -m build --no-isolation"
package-check = "python -m twine check dist/*"
import-check = "python -c \"import fftrf; print(fftrf.TRF.__name__)\""
compare-demo = "python examples/compare_with_mtrf.py --output artifacts/kernel_comparison.png --no-show"
benchmark-demo = "python examples/benchmark_runtime.py --readme-summary README.md"
real-eeg-benchmark = "python examples/benchmark_real_eeg.py --readme-summary README.md"
docs-serve = "mkdocs serve"
docs-build = "mkdocs build --strict"
